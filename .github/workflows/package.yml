# 自动打安装包（GPUI 原生客户端 + Android 客户端 + 四平台独立服务端）：
# - Windows（Inno Setup 的 setup.exe，falcon-desktop 原生客户端 + 同目录的 Rust 服务端）
# - macOS（.pkg，falcon-desktop 原生客户端 + Resources 里的 Rust 服务端）
# - Android（.apk，Rust JNI + Gradle 原生安卓客户端，默认只打 arm64-v8a）
# 同时发布 Linux x64 / arm64、macOS arm64 独立服务端（Windows 那份由 windows job 出并捆进安装包），
# Linux 服务端另有安装文件（.deb / .rpm / install.sh，只含服务端 + systemd 注册），以及汇总的 SHA256SUMS。
# 打法与本机一样，直接调 xtask（win / pkg / android / server / linux），xtask 是唯一真相。
#
# 流水线拓扑（以发版的实际耗时为第一目标）：
# - 一开始全部并发：`sessiond-build`（四个目标各一组：Linux / Windows 目标在 Linux runner 上用 Zig 交叉编，
#   macOS 目标在 macOS runner 上编并跑守护进程测试）、`test`、`macos` / `macos-check`、`windows` /
#   `windows-check`、`servers`（Linux x64 / arm64）、`android`；
# - 要内嵌守护进程的 job 不 `needs` 守护进程：先用占位文件（.github/scripts/sessiond-placeholder.sh）把依赖、
#   客户端与服务端整套编完，再用 .github/scripts/wait-sessiond.sh 等同一次运行里 sessiond-build 各组的产物，
#   换上真文件后用同一条命令重编——include_bytes! 在 falcon-server 的 main.rs，只重编它并重新链接；
#   `xtask server` 出包前核对产物里原样带着四份 gzip。`test` 同样先编测试，再等本机守护进程跑测试；
# - macOS / Windows 测试目标的编译检查拆到 `*-check`，不压在打包 job 的关键路径上；
# - `sessiond` 汇总四目标为 `falcon-sessiond-embed`（供本机 Windows 打包下载、发版前再核对一次）；
#   `release` 汇总全部产物与 SHA256SUMS，校验大小写无重名冲突后创建 GitHub Release。
#
# 缓存策略：
# - GitHub Actions 规定 `refs/tags/v*` 只能读默认分支（`refs/heads/main`）的缓存、不能跨 tag 互读；
#   因此仅 main 写缓存（`save-if`），tag 发版只读；main 推送、每周定时与手动运行负责预热。
# - main 推送若同一提交已有 `v*` tag（版本号提交与 tag 一起推），`gate` 让这次 main 运行整体跳过：
#   tag 那次运行会完整打包，两条流水线同时跑会抢免费账户的并发名额（macOS 同时最多 5 个 job）；
#   tag 流程结束后由 `warm-main` 在 main 上补一次手动触发的运行写缓存，不与发版争抢。
# - Rust 版本固定在顶层 `RUSTUP_TOOLCHAIN`：rustc 版本变了缓存键就变，不能让 stable 发新版时缓存全部失效。
# - 不缓存工作区 crate：checkout 会刷新源码 mtime、发版又必改版本号，工作区 crate 每次都要重编，
#   缓存它们只会挤占仓库 10 GB 的缓存额度、把依赖缓存挤掉。矩阵各组使用独立键。
# - 失败或被取消的 job 不写缓存（不开 cache-on-failure）：rust-cache 的键不含工作区成员版本号，键完全命中时
#   也不再保存，一份编到一半就被取消的残缺缓存会一直顶着这个键，后面完整的永远写不进去（v0.4.6 实测）。
#
# 都没有正式证书签名：Windows 上 SmartScreen、macOS 上 Gatekeeper 会拦，Android 用 debug 签名
# （手机上允许未知来源即可安装），与本机打的包一样。
name: package

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # branches / tags 各自匹配；路径过滤仅约束分支推送，版本 tag 始终打包。
    paths:
      - "native/**"
      - ".github/workflows/package.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # wait-sessiond.sh 查询本次运行的产物与 job 状态
  actions: read

env:
  # 固定 Rust 版本：rust-cache 的键含 rustc 版本，跟着 stable 走的话每次新版发布当天缓存全部失效、
  # 整条流水线冷编译。升级时只改这一处（各 job 的 dtolnay/rust-toolchain 装它）；rustup 代理与
  # xtask（util::rustup_toolchain_bin）都认 RUSTUP_TOOLCHAIN，守护进程的交叉编译也用同一版本。
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  gate:
    # 只在 main 推送时判断；tag / 定时 / 手动运行时本 job 跳过，下游照常执行
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - id: tag
        run: |
          # 分支与 tag 分两次 push 时，tag 可能晚几秒到达
          sleep 10
          if git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' | grep -q "^${GITHUB_SHA}"; then
            echo "提交 ${GITHUB_SHA} 已有 v* tag，由 tag 那次运行打包，本次 main 运行跳过"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  sessiond-build:
    name: sessiond-build (${{ matrix.group }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # xtask 的 Zig 与 cargo-zigbuild 在 x86_64 Linux 上同样能交叉编 Linux / Windows 目标；
          # 每个目标单独一组（libghostty-vt 与 fat LTO 都是单目标串行的长活），Linux runner 不占 macOS 并发名额。
          - group: linux-x64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - group: linux-arm64
            runner: ubuntu-24.04
            targets: aarch64-unknown-linux-musl
          - group: windows
            runner: ubuntu-24.04
            targets: x86_64-pc-windows-gnu
          - group: macos
            runner: macos-latest
            targets: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # native/.cargo/config.toml 把 crates.io 换成 rsproxy 镜像，是给开发机绕 Clash fake-ip 的；
      # runner 网络正常，直连 crates.io 更稳
      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.targets }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # 每组缓存 Zig 工具链、zig-global（musl / mingw C 运行库）与对应目标的 libghostty-vt 静态库。
      # 键里带组名与宿主平台，避免组间互相覆盖，也不把其他组未生成的静态库误认成完整缓存。
      - name: Restore Zig and libghostty-vt cache
        id: cache-zig-ghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/aarch64-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: zig-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{ hashFiles('native/sessiond/ghostty.pin', 'native/sessiond/ghostty-patches/**', 'native/xtask/src/sessiond.rs') }}
          restore-keys: |
            zig-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group }}
          workspaces: |
            native
            native/sessiond -> ../target-sessiond
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and compress session daemon
        env:
          SESSIOND_TARGETS: ${{ matrix.targets }}
        run: |
          cargo build --release --manifest-path native/Cargo.toml --locked -p xtask --no-default-features
          # 清除缓存中可能保留的旧目标归档，只上传本组本次生成的产物。
          rm -rf native/target-sessiond/embed
          ./native/target/release/xtask sessiond --targets "$SESSIOND_TARGETS" --pack-embed

      - name: Check session daemon on group target
        env:
          SESSIOND_TARGETS: ${{ matrix.targets }}
        run: ./native/target/release/xtask sessiond --targets "$SESSIOND_TARGETS" --check

      - name: Test host session daemon
        if: matrix.group == 'macos'
        run: ./native/target/release/xtask sessiond --test

      - name: Save Zig and libghostty-vt cache
        if: github.ref == 'refs/heads/main' && steps.cache-zig-ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/aarch64-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: ${{ steps.cache-zig-ghostty.outputs.cache-primary-key }}

      # 检查 / 测试通过后才上传：下游 wait-sessiond.sh 等到产物即代表这一组已通过
      - uses: actions/upload-artifact@v4
        with:
          name: sessiond-${{ matrix.group }}
          path: native/target-sessiond/embed/*.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  sessiond:
    # 汇总同一次运行的四目标为 falcon-sessiond-embed：本机在 Windows 上打包时从这里下载（docs/deploy.md），
    # 发版前也以它再核对一次四个归档；打包 job 直接取各组产物，不经这里中转。
    needs: sessiond-build
    # 不能用默认的 success()：它连祖先一起看，tag / 定时 / 手动运行里 gate 是 skipped，会把本 job
    # 连带跳过（v0.4.5 实测）。只看直接依赖的结果
    if: ${{ !cancelled() && needs.sessiond-build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sessiond-*
          path: embed
          merge-multiple: true

      - name: Verify all four session daemon archives
        run: |
          test "$(find embed -maxdepth 1 -type f -name '*.gz' | wc -l)" -eq 4
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-gnu; do
            test -s "embed/$target.gz"
            gzip -t "embed/$target.gz"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: embed/*.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  test:
    # 全工作区单元测试。先编测试目标（不依赖守护进程），再等本机 x86_64 musl 守护进程，
    # 让真 PTY 持久会话测试完整运行、不跳过
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # 工作区里的 GPUI 客户端（falcon-platform / falcon-ui / falcon-desktop）在 Linux 上编译要链接的
      # 系统库，与 .agents/setup 给 Linux 开发机装的那份一致（不含只在生成资源时用的命令行工具）
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake libssl-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-imdkit-dev \
            libvulkan-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust workspace tests
        run: cargo test --release --manifest-path native/Cargo.toml --workspace --locked --no-run

      - name: Wait for host session daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-sessiond.sh sessiond-linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: sessiond-linux-x64
          path: native/target-sessiond/embed

      - name: Unpack host session daemon
        run: |
          mkdir -p native/target-sessiond/x86_64-unknown-linux-musl
          gzip -dc native/target-sessiond/embed/x86_64-unknown-linux-musl.gz > native/target-sessiond/x86_64-unknown-linux-musl/falcon-sessiond
          chmod +x native/target-sessiond/x86_64-unknown-linux-musl/falcon-sessiond

      - name: Test Rust workspace
        run: cargo test --release --manifest-path native/Cargo.toml --workspace --locked

  macos:
    # Apple Silicon：一次统一构建本机服务端与原生客户端以打 .pkg；macOS 仅发布 arm64
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: macos-latest
    env:
      FALCON_EMBED_SESSIOND_DIR: ${{ github.workspace }}/native/target-sessiond/embed
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      # xtask 的 icons.rs 用 rsvg-convert 现画 AppIcon 的各档尺寸
      - name: Install librsvg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install librsvg

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Use placeholder session daemons
        run: bash .github/scripts/sessiond-placeholder.sh

      # 一次 cargo build 同时编译 xtask + falcon-server + falcon-desktop，让 tokio / reqwest / log 等公共依赖
      # 统一特性只编一遍；xtask 关闭离线工具特性。--no-default-features 对所有选中的包生效，
      # 客户端的默认特性 webview（HTML 预览）要显式加回来。此时内嵌的还是占位文件。
      - name: Build server, client and xtask
        run: cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond,falcon-desktop/webview -p falcon-desktop

      - name: Wait for session daemons
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-sessiond.sh sessiond-linux-x64 sessiond-linux-arm64 sessiond-windows sessiond-macos

      - name: Drop placeholder session daemons
        run: rm -rf native/target-sessiond/embed

      - uses: actions/download-artifact@v4
        with:
          pattern: sessiond-*
          path: native/target-sessiond/embed
          merge-multiple: true

      # 同一条 cargo build：换上真守护进程后只重编 falcon-server 的 main.rs 并重新链接；
      # xtask server 出包前核对内嵌，随后打单文件与 .pkg
      - name: Relink server with session daemons and build pkg
        run: |
          touch native/target-sessiond/embed/*.gz
          cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond,falcon-desktop/webview -p falcon-desktop
          ./native/target/release/xtask server --target darwin-arm64 --skip-sessiond --skip-cargo
          ./native/target/release/xtask pkg --skip-bin --skip-cargo

      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: |
            release/*.pkg
            release/falcon-v*-darwin-arm64
          if-no-files-found: error

  macos-check:
    # macOS 专属测试代码的编译检查，与打包分开跑
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: macos-latest
    env:
      FALCON_EMBED_SESSIOND_DIR: ${{ github.workspace }}/native/target-sessiond/embed
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # include_bytes! 只要文件存在；check 不产出要发布的二进制
      - name: Use placeholder session daemons
        run: bash .github/scripts/sessiond-placeholder.sh

      - name: Check macOS test targets
        run: |
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-desktop -p falcon-ui --tests
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-server --features embed-sessiond --tests

  windows:
    # 安装包里捆服务端单文件：falcon-v*-win32-x64.exe 与客户端在同一次 cargo build 中编出
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: windows-latest
    env:
      # 原生 Win32 盘符路径：rustc.exe 展开 include_bytes!(env!("FALCON_EMBED_SESSIOND_DIR")) 时
      # 不认 MSYS2 的 /d/a/... 路径，所以不在 bash 里 export，cargo 步骤也保持原生 PowerShell
      FALCON_EMBED_SESSIOND_DIR: ${{ github.workspace }}\native\target-sessiond\embed
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      # xtask 的 win.rs 会在 Program Files (x86)\Inno Setup 6 找 ISCC.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Use placeholder session daemons
        shell: bash
        run: bash .github/scripts/sessiond-placeholder.sh

      - name: Build server, client and xtask
        run: |
          cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond,falcon-desktop/webview -p falcon-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for session daemons
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-sessiond.sh sessiond-linux-x64 sessiond-linux-arm64 sessiond-windows sessiond-macos

      - name: Drop placeholder session daemons
        shell: bash
        run: rm -rf native/target-sessiond/embed

      - uses: actions/download-artifact@v4
        with:
          pattern: sessiond-*
          path: native/target-sessiond/embed
          merge-multiple: true

      - name: Relink server with session daemons and build installer
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem native\target-sessiond\embed\*.gz | ForEach-Object { $_.LastWriteTime = Get-Date }
          cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond,falcon-desktop/webview -p falcon-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native\target\release\xtask.exe server --target win32-x64 --skip-sessiond --skip-cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native\target\release\xtask.exe win --skip-cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: falcon-windows
          path: release/*.exe
          if-no-files-found: error

  windows-check:
    # Windows 专属测试代码的编译检查（cfg(windows) 的测试只有在 Windows 上才编得到），与打包分开跑
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: windows-latest
    env:
      FALCON_EMBED_SESSIOND_DIR: ${{ github.workspace }}\native\target-sessiond\embed
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Use placeholder session daemons
        shell: bash
        run: bash .github/scripts/sessiond-placeholder.sh

      - name: Check Windows test targets
        run: |
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-desktop -p falcon-ui --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-server --features embed-sessiond --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  servers:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      FALCON_EMBED_SESSIOND_DIR: ${{ github.workspace }}/native/target-sessiond/embed
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Use placeholder session daemons
        run: bash .github/scripts/sessiond-placeholder.sh

      # Linux 安装文件（.deb / .rpm / install.sh）只含服务端；关掉 xtask 默认离线工具特性省去 ICU 依赖编译
      - name: Build server and xtask
        run: cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond

      - name: Wait for session daemons
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-sessiond.sh sessiond-linux-x64 sessiond-linux-arm64 sessiond-windows sessiond-macos

      - name: Drop placeholder session daemons
        run: rm -rf native/target-sessiond/embed

      - uses: actions/download-artifact@v4
        with:
          pattern: sessiond-*
          path: native/target-sessiond/embed
          merge-multiple: true

      - name: Relink server with session daemons and build Linux packages
        run: |
          touch native/target-sessiond/embed/*.gz
          cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond
          ./native/target/release/xtask server --target ${{ matrix.platform }} --skip-sessiond --skip-cargo
          ./native/target/release/xtask linux --target ${{ matrix.platform }}

      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: falcon-server-${{ matrix.platform }}
          path: release/falcon-v*-${{ matrix.platform }}*
          if-no-files-found: error

  android:
    # 不依赖守护进程；默认只打真机主流 arm64-v8a 架构（模拟器用的 x86_64 本地传 --abis 另打）
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # Gradle 9.9.1 + AGP 9.5.1，与 android/app/build.gradle.kts 的 jvmTarget = 17 对齐；
      # xtask 的 android.rs 跑 gradlew --no-daemon，构建完守护进程即退出，不会锁住 ~/.gradle 缓存
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # runner 预装的 /usr/local/lib/android/sdk 归 root 所有，AGP 缺组件时要往里下载，
      # 目录不可写会在构建期直接报错。compileSdk 37 的平台包名带次版本号（android-37.0），
      # 这里显式装好，不依赖 AGP 构建期自动下载。
      # 只改顶层条目与 platforms / build-tools / licenses 的属主（不递归几十万文件的 ndk/），
      # 再以当前用户补齐缺失组件（sudo 会清掉 setup-java 设的 JAVA_HOME）
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo mkdir -p "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"
          sudo find "$SDK" -maxdepth 1 -exec chown "$USER:$USER" {} +
          sudo chown -R "$USER:$USER" "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          MISSING=()
          [ -d "$SDK/platforms/android-37.0" ] || MISSING+=("platforms;android-37.0")
          [ -d "$SDK/build-tools/34.0.0" ] || MISSING+=("build-tools;34.0.0")
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME}" ]; then
            if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
              MISSING+=("ndk;27.2.12479018")
            fi
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null || true
            (yes || true) | "$SDKMANAGER" --install "${MISSING[@]}"
          fi

      # xtask/src/android.rs 默认只交叉编译 arm64-v8a 的 falcon-android JNI 动态库
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build APK
        run: cargo run --release --manifest-path native/Cargo.toml --locked -p xtask --no-default-features -- android

      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: falcon-android
          path: release/*.apk
          if-no-files-found: error

  release:
    # 同 sessiond：默认 success() 会因祖先 gate 被跳过而跳过发版，改为逐个要求直接依赖成功。
    # 不用 `!contains(needs.*.result, …)` 的通配写法：v0.4.6 实测全部依赖成功时它仍判为假、发版被跳过，
    # 逐个写 `needs.<job>.result == 'success'` 与 sessiond 的条件同一种写法，已实测可用
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.sessiond.result == 'success'
      && needs.test.result == 'success'
      && needs.macos.result == 'success'
      && needs.macos-check.result == 'success'
      && needs.windows.result == 'success'
      && needs.windows-check.result == 'success'
      && needs.android.result == 'success'
      && needs.servers.result == 'success' }}
    needs: [sessiond, test, macos, macos-check, windows, windows-check, android, servers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: falcon-*
          merge-multiple: true

      # 内嵌资源仅用于工作流内部，不作为 Release 资产（只剔除 <triple>.gz，不碰 *.tar.gz 形式的资产）。清单对最终签名后的独立服务端求和。
      - name: 核对服务端平台并生成 SHA256SUMS
        shell: bash
        run: |
          find dist -maxdepth 1 -name '*.gz' ! -name '*.tar.gz' -delete
          cd dist
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64.exe; do
            test -f "falcon-${GITHUB_REF_NAME}-${platform}"
          done
          sha256sum falcon-v*-darwin-arm64 falcon-v*-linux-* falcon-v*-win32-x64.exe > SHA256SUMS
          DUP=$(ls -1 | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "GitHub Release 资产文件名存在大小写不敏感重名冲突：$DUP" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  warm-main:
    # tag 运行只能读 main 的缓存、写不进去；版本号提交与 tag 一起推时，main 那次运行又被 gate 跳过。
    # 发版流程结束后（成功或失败都执行，被取消不执行）在 main 上补一次手动触发的运行，把依赖缓存写进
    # main，下一次发版即可命中。GITHUB_TOKEN 触发的 workflow_dispatch 会照常创建运行；那次运行不是
    # tag，不会再触发本 job。
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch cache warm-up on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run package.yml --repo "$GITHUB_REPOSITORY" --ref main
