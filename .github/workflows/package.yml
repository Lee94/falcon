# 自动打安装包（NSH 六端统一客户端 ADR 0028 + 五平台独立服务端）：
# - Windows（Inno Setup 的 setup.exe，falcon-app 原生客户端 + 同目录的 Rust 服务端）
# - macOS（.pkg，falcon-app 原生客户端 + Resources 里的 Rust 服务端，含 TUI 模式）
# - Linux 桌面与 Web（Falcon-v*-linux-x64.deb/.tar.gz GTK4 桌面端 + Falcon-v*-web.tar.gz 纯 Rust WASM 站点）
# - Android（.apk，纯 Rust NSH + Android SDK 原生打包，零 Gradle / 零 Kotlin）
# 同时发布 Linux / macOS x64、arm64 独立服务端（Windows 那份由 windows job 出，打进安装包），
# Linux 服务端另有安装文件（.deb / .rpm / install.sh，只含服务端 + systemd 注册），以及汇总的 SHA256SUMS。
# 打法与本机一样，直接跑 cargo xtask win / pkg / linux-desktop / web / android / server / linux，xtask 是唯一真相。
# 下面删了 native/.cargo/config.toml（xtask 别名也在里面），所以写成 cargo run --release -p xtask --。
#
# - 推 v* tag：全量编译检查、测试、各端安装包与五平台服务端都通过后建 GitHub Release 并挂上；
# - 手动触发（Actions 页 Run workflow）：只出构建产物（Artifacts），不发版；
# - 定时触发（每周一次在默认分支 main 上跑）：刷新 main 分支上的编译缓存——GitHub Actions
#   规定 refs/tags/v* 只能读取默认分支（main）的缓存、不能跨 tag 互读，且 7 天未访问会被淘汰。
#
# 都没有正式证书签名：Windows 上 SmartScreen、macOS 上 Gatekeeper 会拦，Android 用 debug 签名
# （手机上允许未知来源即可安装），与本机打的包一样。
name: package

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # 安装包里要捆服务端单文件：falcon-v*-win32-x64.exe 在 windows job 里编（守护进程
    # 内嵌资源复用 macos job 的那批）
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # native/.cargo/config.toml 把 crates.io 换成 rsproxy 镜像，是给开发机绕 Clash fake-ip 的；
      # runner 网络正常，直连 crates.io 更稳
      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      # Windows 包不编浏览器版，不用 wasm target
      - uses: dtolnay/rust-toolchain@stable

      # xtask 的 win.rs 会在 Program Files (x86)\Inno Setup 6 找 ISCC.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true

      # 与 servers job 同一批内嵌守护进程（跨 OS 复用，避免在 Windows runner 装 Zig）
      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed

      # 服务端发布单文件，win.rs 把它捆进安装包
      - name: Build server
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- server --target win32-x64 --skip-sessiond

      # exe 的图标 / 字体取自仓库里已生成的文件；rc.exe 来自 runner 自带的 VS 生成工具。
      # xtask 也用 --release 跑，与 falcon-app 共用 target/release 的依赖，不再单独编一份 debug
      - name: Build installer
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- win

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    # Apple Silicon；Intel 机器的包要另起一个 macos-13 的 job
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # 会话守护进程（cargo xtask sessiond，服务端发布构建会调）要 5 个目标
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu

      # 守护进程的交叉编译用 cargo-zigbuild（Zig 本身由 xtask 按锁定版本下载、校验）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # xtask 的 icons.rs 用 rsvg-convert 现画 AppIcon 的各档尺寸
      - name: Install librsvg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install librsvg

      # Zig 工具链、zig-global（musl / mingw C 运行库缓存）与 5 个目标的 libghostty-vt 静态库
      # 只随 ghostty.pin / 补丁 / sessiond.rs 变动，单独缓存后跨版本永久命中，省掉约 11.5 分钟的
      # Zig 编译；排除 900MB+ 的 ghostty 源码与 .zig-cache 中间目录以及原始压缩包
      - name: Cache Zig and libghostty-vt
        uses: actions/cache@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/*-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: zig-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/sessiond/ghostty.pin', 'native/sessiond/ghostty-patches/**', 'native/xtask/src/sessiond.rs') }}
          restore-keys: |
            zig-ghostty-${{ runner.os }}-${{ runner.arch }}-

      # 服务端与客户端共用 native/target；守护进程是独立工作区 native/sessiond（产物在
      # native/target-sessiond），按 workspace -> target 语法交给 rust-cache 统一管理并保留
      # 工作区内部 lib crate 缓存。不开启 cache-on-failure，避免前置步骤偶发失败时写入空缓存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/sessiond -> ../target-sessiond
          cache-workspace-crates: true

      # 没有服务端产物时 pkg 会先走 server（编 5 个目标的会话守护进程、cargo 编服务端）
      - name: Build pkg
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- pkg

      # 本地提交与 push 只做局部检查；全量验证放在发版流程，使用 release profile 复用打包依赖。
      # 先构建 pkg，确保真 PTY 的持久会话测试能找到本机守护进程，避免因缺少二进制而跳过。
      # Release 依赖 macos job，以下任一步失败都不会发布。
      # sessiond 是独立工作区：五个目标都做编译检查，测试只在 runner 本机执行。
      - name: Check and test session daemon
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- sessiond --targets all --check --test

      - name: Check Rust workspace
        run: cargo check --release --manifest-path native/Cargo.toml --workspace --tests --locked

      - name: Test Rust workspace
        run: cargo test --release --manifest-path native/Cargo.toml --workspace --locked

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: |
            release/*.pkg
            release/falcon-v*-darwin-arm64
          if-no-files-found: error

      # 五平台服务端共用这一批守护进程，Windows runner 不需要自行构建 Zig / Ghostty。
      - uses: actions/upload-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed/*.gz
          if-no-files-found: error

  servers:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed
      - name: 构建独立服务端
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- server --target ${{ matrix.platform }} --skip-sessiond
      # Linux 安装文件（.deb / .rpm / install.sh）只含服务端；文件名后缀是平台名，
      # falcon-v*-<平台>* 的 artifact glob 已经覆盖
      - name: 打 Linux 安装文件
        if: startsWith(matrix.platform, 'linux-')
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- linux --target ${{ matrix.platform }}
      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-server-${{ matrix.platform }}
          path: release/falcon-v*-${{ matrix.platform }}*
          if-no-files-found: error

  web-linux:
    # nsh-platform-linux 要求 GTK 4.14+（Ubuntu 24.04 自带），独立于 servers 的 ubuntu-22.04（保持服务端 glibc 2.35 兼容）；
    # 同机顺带产出纯 Rust wasm32-unknown-unknown Web 客户端归档包。
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - name: Install GTK4 and GStreamer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true

      - name: Build Linux GTK4 desktop client
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- linux-desktop --target linux-x64

      - name: Build pure-Rust Web client
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- web

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-web-linux
          path: |
            release/Falcon-v*-linux-x64*
            release/Falcon-v*-web.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # xtask/src/android.rs 直接调用 JDK 17 的 javac / jar / keytool 与 Android SDK 的 d8 / aapt2 / zipalign / apksigner，
      # 仓库内已无 Gradle / Kotlin 工程，不再挂载 gradle 缓存。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 预装的 /usr/local/lib/android/sdk 归 root 所有；只改顶层条目与 platforms / build-tools / licenses
      # 的属主（不递归几十万文件的 ndk/），再以当前用户补齐 android-35 与 build-tools 35.0.0。
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo mkdir -p "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"
          sudo find "$SDK" -maxdepth 1 -exec chown "$USER:$USER" {} +
          sudo chown -R "$USER:$USER" "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          MISSING=()
          [ -d "$SDK/platforms/android-35" ] || MISSING+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || MISSING+=("build-tools;35.0.0")
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME}" ]; then
            if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
              MISSING+=("ndk;27.2.12479018")
            fi
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null || true
            (yes || true) | "$SDKMANAGER" --install "${MISSING[@]}"
          fi

      # xtask/src/android.rs 交叉编 arm64-v8a 与 x86_64 两个 NSH 动态库（libnsh.so）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true

      - name: Build APK
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- android

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-android
          path: release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android, servers, web-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: falcon-*
          merge-multiple: true

      # 内嵌资源仅用于工作流内部，不作为 Release 资产（仅剔除 <triple>.gz，保留客户端 *.tar.gz）。清单对最终签名后的独立服务端求和。
      - name: 核对服务端平台并生成 SHA256SUMS
        shell: bash
        run: |
          find dist -maxdepth 1 -name '*.gz' ! -name '*.tar.gz' -delete
          cd dist
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64.exe; do
            test -f "falcon-${GITHUB_REF_NAME}-${platform}"
          done
          sha256sum falcon-v*-darwin-* falcon-v*-linux-* falcon-v*-win32-x64.exe > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
