# 自动打安装包：Windows（Inno Setup 的 setup.exe，只有原生客户端）与 macOS（.pkg，原生客户端 +
# Resources 里的 Rust 服务端）。打法与本机一样，直接跑 cargo xtask win / cargo xtask pkg，xtask 是唯一真相。
# 下面删了 native/.cargo/config.toml（xtask 别名也在里面），所以写成 cargo run -p xtask --。
#
# - 推 v* tag：两个包都打完后建 GitHub Release 并挂上；
# - 手动触发（Actions 页 Run workflow）：只出构建产物（Artifacts），不发版。
#
# 都没有签名：Windows 上 SmartScreen、macOS 上 Gatekeeper 会拦，与本机打的包一样。
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # native/.cargo/config.toml 把 crates.io 换成 rsproxy 镜像，是给开发机绕 Clash fake-ip 的；
      # runner 网络正常，直连 crates.io 更稳
      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      # Windows 包里只有原生客户端，不编浏览器版，不用 wasm target
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # 失败的冷启动也留缓存，重跑不用从零编
          cache-on-failure: true

      # xtask 的 win.rs 会在 Program Files (x86)\Inno Setup 6 找 ISCC.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # exe 的图标 / 字体取自仓库里已生成的文件；rc.exe 来自 runner 自带的 VS 生成工具
      - name: Build installer
        run: cargo run --manifest-path native/Cargo.toml -p xtask -- win

      - uses: actions/upload-artifact@v4
        with:
          name: falcon-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    # Apple Silicon；Intel 机器的包要另起一个 macos-13 的 job
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # 浏览器版（native/scripts/build-web.sh）要 wasm32 target 与同版本的 wasm-bindgen-cli；
      # 会话守护进程（cargo xtask sessiond，服务端发布构建会调）要另外 5 个目标
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu

      # 打包一共写四个 target 目录：native/target（原生客户端）、target-wasm（浏览器版）、
      # target-sessiond（守护进程的 5 个交叉目标）、target-server（带 embed 的服务端）。
      # rust-cache 默认只管 <workspace>/target，其余三个连工具链缓存（zig / ghostty 静态库 /
      # meegle CLI）一起补上；cache-on-failure 让失败的冷启动也留下缓存，重跑不用从零编
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true
          cache-directories: |
            native/target-wasm
            native/target-sessiond
            native/target-server
            native/.cache

      # install-action 直接装 GitHub Releases 的预编译二进制（wasm-bindgen 自 0.2.100 起发
      # aarch64-apple-darwin 包），省掉两次 cargo install 的源码编译；
      # wasm-bindgen-cli 版本必须与 Cargo.lock 一致（build-web.sh 会查）
      - name: Resolve wasm-bindgen-cli version
        id: wb
        run: echo "ver=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' native/Cargo.lock)" >> "$GITHUB_OUTPUT"

      # 守护进程的交叉编译用 cargo-zigbuild（Zig 本身由 xtask 按钉死的版本下载、校验）
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.ver }},cargo-zigbuild

      # xtask 的 icons.rs 用 rsvg-convert 现画 AppIcon 的各档尺寸
      - name: Install librsvg
        run: brew install librsvg

      # 没有服务端产物时 pkg 会先走 server（构建浏览器版、从 npm 仓库取锁定版本的 meegle CLI、
      # 编 5 个目标的会话守护进程、cargo 编服务端）
      - name: Build pkg
        run: cargo run --manifest-path native/Cargo.toml -p xtask -- pkg

      - uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: release/*.pkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
