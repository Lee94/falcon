# 自动打安装包：Windows（Inno Setup 的 setup.exe，只有原生客户端）、macOS（.pkg，原生客户端 +
# Resources 里的 Rust 服务端）与 Android（.apk，Rust JNI + Gradle 原生安卓客户端）。
# 打法与本机一样，直接跑 cargo xtask win / pkg / android，xtask 是唯一真相。
# 下面删了 native/.cargo/config.toml（xtask 别名也在里面），所以写成 cargo run --release -p xtask --。
#
# - 推 v* tag：全量编译检查、测试与三个包都通过后建 GitHub Release 并挂上；
# - 手动触发（Actions 页 Run workflow）：只出构建产物（Artifacts），不发版；
# - 定时触发（每周一次在默认分支 main 上跑）：刷新 main 分支上的编译缓存——GitHub Actions
#   规定 refs/tags/v* 只能读取默认分支（main）的缓存、不能跨 tag 互读，且 7 天未访问会被淘汰。
#
# 都没有正式证书签名：Windows 上 SmartScreen、macOS 上 Gatekeeper 会拦，Android 用 debug 签名
# （手机上允许未知来源即可安装），与本机打的包一样。
name: package

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # native/.cargo/config.toml 把 crates.io 换成 rsproxy 镜像，是给开发机绕 Clash fake-ip 的；
      # runner 网络正常，直连 crates.io 更稳
      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      # Windows 包里只有原生客户端，不编浏览器版，不用 wasm target
      - uses: dtolnay/rust-toolchain@stable

      # xtask 的 win.rs 会在 Program Files (x86)\Inno Setup 6 找 ISCC.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true

      # exe 的图标 / 字体取自仓库里已生成的文件；rc.exe 来自 runner 自带的 VS 生成工具。
      # xtask 也用 --release 跑，与 falcon-desktop 共用 target/release 的依赖，不再单独编一份 debug
      - name: Build installer
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- win

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    # Apple Silicon；Intel 机器的包要另起一个 macos-13 的 job
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # 会话守护进程（cargo xtask sessiond，服务端发布构建会调）要 5 个目标
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu

      # 守护进程的交叉编译用 cargo-zigbuild（Zig 本身由 xtask 按锁定版本下载、校验）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # xtask 的 icons.rs 用 rsvg-convert 现画 AppIcon 的各档尺寸
      - name: Install librsvg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install librsvg

      # Zig 工具链、zig-global（musl / mingw C 运行库缓存）与 5 个目标的 libghostty-vt 静态库
      # 只随 ghostty.pin / 补丁 / sessiond.rs 变动，单独缓存后跨版本永久命中，省掉约 11.5 分钟的
      # Zig 编译；排除 900MB+ 的 ghostty 源码与 .zig-cache 中间目录以及原始压缩包
      - name: Cache Zig and libghostty-vt
        uses: actions/cache@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/*-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: zig-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/sessiond/ghostty.pin', 'native/sessiond/ghostty-patches/**', 'native/xtask/src/sessiond.rs') }}
          restore-keys: |
            zig-ghostty-${{ runner.os }}-${{ runner.arch }}-

      # 服务端与客户端共用 native/target；守护进程是独立工作区 native/sessiond（产物在
      # native/target-sessiond），按 workspace -> target 语法交给 rust-cache 统一管理并保留
      # 工作区内部 lib crate 缓存。不开启 cache-on-failure，避免前置步骤偶发失败时写入空缓存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/sessiond -> ../target-sessiond
          cache-workspace-crates: true

      # 没有服务端产物时 pkg 会先走 server（编 5 个目标的会话守护进程、cargo 编服务端）
      - name: Build pkg
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- pkg

      # 本地提交与 push 只做局部检查；全量验证放在发版流程，使用 release profile 复用打包依赖。
      # 先构建 pkg，确保真 PTY 的持久会话测试能找到本机守护进程，避免因缺少二进制而跳过。
      # Release 依赖 macos job，以下任一步失败都不会发布。
      # sessiond 是独立工作区：五个目标都做编译检查，测试只在 runner 本机执行。
      - name: Check and test session daemon
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- sessiond --targets all --check --test

      - name: Check Rust workspace
        run: cargo check --release --manifest-path native/Cargo.toml --workspace --tests --locked

      - name: Test Rust workspace
        run: cargo test --release --manifest-path native/Cargo.toml --workspace --locked

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: release/*.pkg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # Gradle 8.9 + AGP 8.7.2，与 android/app/build.gradle.kts 的 jvmTarget = 17 对齐；
      # xtask 的 android.rs 跑 gradlew --no-daemon，构建完守护进程即退出，不会锁住 ~/.gradle 缓存
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # runner 预装的 /usr/local/lib/android/sdk 归 root 所有，而 AGP 8.7.2 默认要
      # build-tools;34.0.0（镜像里通常只留更新的版本），目录不可写会在构建期直接报错。
      # 只改顶层条目与 platforms / build-tools / licenses 的属主（不递归几十万文件的 ndk/），
      # 再以当前用户补齐缺失组件（sudo 会清掉 setup-java 设的 JAVA_HOME）
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo mkdir -p "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"
          sudo find "$SDK" -maxdepth 1 -exec chown "$USER:$USER" {} +
          sudo chown -R "$USER:$USER" "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          MISSING=()
          [ -d "$SDK/platforms/android-35" ] || MISSING+=("platforms;android-35")
          [ -d "$SDK/build-tools/34.0.0" ] || MISSING+=("build-tools;34.0.0")
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME}" ]; then
            if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
              MISSING+=("ndk;27.2.12479018")
            fi
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null || true
            (yes || true) | "$SDKMANAGER" --install "${MISSING[@]}"
          fi

      # xtask/src/android.rs 交叉编 arm64-v8a 与 x86_64 两个 JNI 动态库
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true

      - name: Build APK
        run: cargo run --release --manifest-path native/Cargo.toml -p xtask -- android

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-android
          path: release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
