# 自动打安装包（NSH 六端统一客户端 ADR 0028 + 五平台独立服务端）：
# - Windows（Inno Setup 的 setup.exe，falcon-app 原生客户端 + 同目录的 Rust 服务端）
# - macOS（.pkg，falcon-app 原生客户端 + Resources 里的 Rust 服务端，含 TUI 模式；顺带交叉编出 darwin-x64 独立服务端）
# - Linux 桌面与 Web（Falcon-v*-linux-x64-desktop.deb/.tar.gz GTK4 桌面端 + Falcon-v*-web.tar.gz 纯 Rust WASM 站点）
# - Android（.apk，默认 arm64-v8a，纯 Rust NSH + Android SDK 原生打包，零 Gradle / 零 Kotlin）
# 同时发布 Linux / macOS x64、arm64 独立服务端（Windows 那份由 windows job 出并捆进安装包），
# Linux 服务端另有安装文件（.deb / .rpm / install.sh，只含服务端 + systemd 注册），以及汇总的 SHA256SUMS。
# 打法与本机一样，直接调 xtask（win / pkg / linux-desktop / web / android / server / linux），xtask 是唯一真相。
#
# 流水线并行拓扑：
# - 第一阶段（t=0 立即并发）：`sessiond`（五目标守护进程构建 + 零警告检查 + 测试）、`web-linux`、`android`；
# - 第二阶段（拿到 `falcon-sessiond-embed` 后并发）：`test`（全工作区测试与 30 万行帧耗时门禁）、
#   `macos`（一次统一编译服务端+客户端并顺带交叉编 `darwin-x64`，省去慢速 Intel macOS runner）、
#   `windows`（一次统一编译服务端+客户端，消除 tokio/reqwest 特性并集不一致导致的二次重编）、`servers`（Linux x64/arm64）；
# - 第三阶段：`release` 汇总全部产物与 SHA256SUMS，校验大小写无重名冲突后创建 GitHub Release。
#
# 缓存策略：
# - GitHub Actions 规定 `refs/tags/v*` 只能读默认分支（`refs/heads/main`）的缓存、不能跨 tag 互读；
# - 因此缓存只在 `refs/heads/main`（每周定时或手动 Run workflow）写入（`save-if`），tag 发版只读不写，省去每个 job 末尾数分钟无效上传。
#
# 都没有正式证书签名：Windows 上 SmartScreen、macOS 上 Gatekeeper 会拦，Android 用 debug 签名
# （手机上允许未知来源即可安装），与本机打的包一样。
name: package

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sessiond:
    # 独立产出五目标会话守护进程（ADR 0020），一完成即同时解锁 test / macos / windows / servers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # native/.cargo/config.toml 把 crates.io 换成 rsproxy 镜像，是给开发机绕 Clash fake-ip 的；
      # runner 网络正常，直连 crates.io 更稳
      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Zig 工具链、zig-global（musl / mingw C 运行库缓存）与 5 个目标的 libghostty-vt 静态库
      # 只随 ghostty.pin / 补丁 / sessiond.rs 变动，单独缓存后跨版本命中，省掉约 10.5 分钟 Zig 编译
      - name: Restore Zig and libghostty-vt cache
        id: cache-zig-ghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/*-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: zig-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/sessiond/ghostty.pin', 'native/sessiond/ghostty-patches/**', 'native/xtask/src/sessiond.rs') }}
          restore-keys: |
            zig-ghostty-${{ runner.os }}-${{ runner.arch }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            native/sessiond -> ../target-sessiond
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build, check and test session daemon
        run: |
          cargo build --release --manifest-path native/Cargo.toml --locked -p xtask --no-default-features
          ./native/target/release/xtask sessiond --targets all --pack-embed
          ./native/target/release/xtask sessiond --targets all --check --test

      - name: Save Zig and libghostty-vt cache
        if: github.ref == 'refs/heads/main' && steps.cache-zig-ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/.cache/zig/zig-*
            !native/.cache/zig/*.tar.xz
            native/.cache/zig-global
            native/.cache/ghostty/*/out-*/include
            native/.cache/ghostty/*/*-linux-musl
            native/.cache/ghostty/*/*-apple-darwin
            native/.cache/ghostty/*/*-windows-gnu
          key: ${{ steps.cache-zig-ghostty.outputs.cache-primary-key }}

      # 五平台服务端与工作区真 PTY 持久会话测试共用这一批守护进程（定时任务也要传给下游 job）
      - uses: actions/upload-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed/*.gz
          if-no-files-found: error

  test:
    # 全工作区单元测试、Headless 界面回归与 FalconTerminal 30 万行 Release 帧耗时门禁（p95 < 4.0ms），
    # 在 4 核 x64 Ubuntu runner 上与 macos / windows 完全并行，不再挤占 macOS 打包关键路径
    needs: sessiond
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed

      # 解出本机 x86_64-unknown-linux-musl 守护进程，确保 falcon-server 的真 PTY 持久会话测试完整运行、不跳过
      - name: Unpack host session daemon
        run: |
          mkdir -p native/target-sessiond/x86_64-unknown-linux-musl
          gzip -dc native/target-sessiond/embed/x86_64-unknown-linux-musl.gz > native/target-sessiond/x86_64-unknown-linux-musl/falcon-sessiond
          chmod +x native/target-sessiond/x86_64-unknown-linux-musl/falcon-sessiond

      - name: Test Rust workspace
        run: cargo test --release --manifest-path native/Cargo.toml --workspace --locked

  macos:
    # Apple Silicon：一次统一构建本机服务端与原生客户端以打 .pkg，并同机交叉编出 darwin-x64 独立服务端
    needs: sessiond
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # xtask 的 icons.rs 用 rsvg-convert 现画 AppIcon 的各档尺寸
      - name: Install librsvg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install librsvg

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed

      # 一次 cargo build 同时编译 xtask + falcon-server + falcon-app，让 tokio / reqwest / log 等公共依赖
      # 统一特性只编一遍；随后打 darwin-arm64 单文件与 .pkg，再交叉编译纯 Rust 的 darwin-x64 服务端并检查 macOS 专属测试代码
      - name: Build macOS pkg, arm64 & x64 servers, and check macOS tests
        run: |
          export FALCON_EMBED_SESSIOND_DIR="$PWD/native/target-sessiond/embed"
          cargo build --release --manifest-path native/Cargo.toml --locked -p xtask -p falcon-server --features falcon-server/embed-sessiond -p falcon-app
          ./native/target/release/xtask server --target darwin-arm64 --skip-sessiond --skip-cargo
          ./native/target/release/xtask pkg --skip-bin --skip-cargo
          ./native/target/release/xtask server --target darwin-x64 --skip-sessiond
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-app --tests
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-server --features embed-sessiond --tests

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: |
            release/*.pkg
            release/falcon-v*-darwin-arm64
            release/falcon-v*-darwin-x64
          if-no-files-found: error

  windows:
    # 安装包里捆服务端单文件：falcon-v*-win32-x64.exe 与客户端在同一次 cargo build 中编出
    needs: sessiond
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable

      # xtask 的 win.rs 会在 Program Files (x86)\Inno Setup 6 找 ISCC.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed

      # 注意保持原生 PowerShell（不要切 bash）：rustc.exe 在编译期展开 include_bytes!(env!("FALCON_EMBED_SESSIOND_DIR"))
      # 时只认原生 Win32 盘符路径，不认 MSYS2 的 /d/a/... 路径
      - name: Build Windows server, installer, and check Windows tests
        run: |
          $ErrorActionPreference = "Stop"
          $env:FALCON_EMBED_SESSIOND_DIR = (Resolve-Path "native\target-sessiond\embed").Path
          cargo build --release --manifest-path native/Cargo.toml --locked -p xtask -p falcon-server --features falcon-server/embed-sessiond -p falcon-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native\target\release\xtask.exe server --target win32-x64 --skip-sessiond --skip-cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native\target\release\xtask.exe win --skip-cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-app --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-server --features embed-sessiond --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-windows
          path: release/*.exe
          if-no-files-found: error

  servers:
    needs: sessiond
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        shell: bash
        run: rm -f native/.cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          name: falcon-sessiond-embed
          path: native/target-sessiond/embed

      # Linux 安装文件（.deb / .rpm / install.sh）只含服务端；关掉 xtask 默认离线工具特性省去 ICU 依赖编译
      - name: Build Linux server and packages
        run: |
          export FALCON_EMBED_SESSIOND_DIR="$PWD/native/target-sessiond/embed"
          cargo build --release --manifest-path native/Cargo.toml --locked --no-default-features -p xtask -p falcon-server --features falcon-server/embed-sessiond
          ./native/target/release/xtask server --target ${{ matrix.platform }} --skip-sessiond --skip-cargo
          ./native/target/release/xtask linux --target ${{ matrix.platform }}

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-server-${{ matrix.platform }}
          path: release/falcon-v*-${{ matrix.platform }}*
          if-no-files-found: error

  web-linux:
    # nsh-platform-linux 要求 GTK 4.14+（Ubuntu 24.04 自带），独立于 servers 的 ubuntu-22.04（保持服务端 glibc 2.35 兼容）；
    # 同机顺带产出纯 Rust wasm32-unknown-unknown Web 客户端归档包，不依赖 sessiond 内嵌产物，t=0 立即并发启动
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      - name: Install GTK4, WebKitGTK 6 and GStreamer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang llvm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Linux GTK4 desktop and pure-Rust Web clients
        run: |
          cargo build --release --manifest-path native/Cargo.toml --locked -p xtask -p falcon-app --features falcon-app/linux-desktop
          ./native/target/release/xtask linux-desktop --skip-cargo --target linux-x64
          ./native/target/release/xtask web
          cargo check --release --manifest-path native/Cargo.toml --locked -p falcon-app --features linux-desktop --tests

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-web-linux
          path: |
            release/Falcon-v*-linux-x64-desktop.*
            release/Falcon-v*-web.tar.gz
          if-no-files-found: error

  android:
    # 不依赖 sessiond 内嵌产物，t=0 立即并发启动；仅打真机主流 arm64-v8a 架构
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop crates.io mirror
        run: rm -f native/.cargo/config.toml

      # xtask/src/android.rs 直接调用 JDK 17 的 javac / jar / keytool 与 Android SDK 的 d8 / aapt2 / zipalign / apksigner，
      # 仓库内已无 Gradle / Kotlin 工程，不再挂载 gradle 缓存。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 预装的 /usr/local/lib/android/sdk 归 root 所有；只改顶层条目与 platforms / build-tools / licenses
      # 的属主（不递归几十万文件的 ndk/），再以当前用户补齐 android-35 与 build-tools 35.0.0。
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo mkdir -p "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"
          sudo find "$SDK" -maxdepth 1 -exec chown "$USER:$USER" {} +
          sudo chown -R "$USER:$USER" "$SDK/licenses" "$SDK/platforms" "$SDK/build-tools"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          MISSING=()
          [ -d "$SDK/platforms/android-35" ] || MISSING+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || MISSING+=("build-tools;35.0.0")
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "${ANDROID_NDK_HOME}" ]; then
            if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
              MISSING+=("ndk;27.2.12479018")
            fi
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null || true
            (yes || true) | "$SDKMANAGER" --install "${MISSING[@]}"
          fi

      # xtask/src/android.rs 默认仅交叉编译 arm64-v8a NSH 动态库（libnsh.so）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build APK
        run: cargo run --release --manifest-path native/Cargo.toml --locked -p xtask --no-default-features -- android

      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: falcon-android
          path: release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sessiond, test, windows, macos, android, servers, web-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: falcon-*
          merge-multiple: true

      # 内嵌资源仅用于工作流内部，不作为 Release 资产（仅剔除 <triple>.gz，保留客户端 *.tar.gz）。清单对最终签名后的独立服务端求和。
      - name: 核对服务端平台并生成 SHA256SUMS
        shell: bash
        run: |
          find dist -maxdepth 1 -name '*.gz' ! -name '*.tar.gz' -delete
          cd dist
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64.exe; do
            test -f "falcon-${GITHUB_REF_NAME}-${platform}"
          done
          sha256sum falcon-v*-darwin-* falcon-v*-linux-* falcon-v*-win32-x64.exe > SHA256SUMS
          DUP=$(ls -1 | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "GitHub Release 资产文件名存在大小写不敏感重名冲突：$DUP" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
