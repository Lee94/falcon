# 构建 / 打包 / 资源生成任务：cargo xtask <命令>（见 xtask/src/main.rs）
[alias]
xtask = "run --package xtask --"

# 这台开发机上 Clash 的 fake-ip 把 index.crates.io 解析到 198.18.x，TLS 握手
# 直接失败（static.crates.io 倒是通的）。只在 native/ 目录里把 crates-io 换成
# rsproxy 的稀疏索引，不动全局 ~/.cargo。网络正常的机器删掉这一段即可。
[source.crates-io]
replace-with = "rsproxy"

[source.rsproxy]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
