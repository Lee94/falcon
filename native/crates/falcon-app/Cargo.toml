[package]
name = "falcon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "falcon-app"
path = "src/main.rs"

[features]
default = ["webview"]
# HTML 预览的原生 WebView（src/panels/file_view/html.rs）。关掉时退成"在浏览器中打开"的提示
webview = ["dep:wry"]
# 脚本化驱动（FALCON_AUTOMATE，见 src/automation.rs）。单开它不带 test-support，
# 压测（frames 步骤）量到的才是真实 release 的开销
automation = []
# 调试截图：打开 gpui-kit 的 test-support 才有 Window::render_to_image（Metal 回读，
# 锁屏时也能拿到画面）。见 src/snapshot.rs。test-support 会给元素多包一层观测，别拿它压测
snapshot = ["automation", "gpui-kit/test-support"]

[build-dependencies]
woff2 = { package = "woff2-patched", version = "0.4" }
bytes = "1"

# Windows：exe 自带图标与版本信息（build.rs 的 windows_resources）。按构建机 cfg 挂——
# 没有从 macOS 交叉编 Windows 的需求，mac 上就不多编这两个
[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[dependencies]
falcon-proto.workspace = true
falcon-client.workspace = true
falcon-term.workspace = true
falcon-theme.workspace = true
falcon-core.workspace = true
gpui-kit.workspace = true
# HTML 预览（ADR 0007）：直接用 wry 自己挂 WKWebView。版本跟 gpui-wry =0.7.1 锁的那份一致
# （它是 gpui-kit 同批发布的 WebView 封装，但不重新导出 wry，接口也不够我们控导航 / 下载），
# 升级 gpui-kit 时照它的 Cargo.toml 一起换
wry = { package = "lb-wry", version = "=0.53.3", optional = true }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
futures.workspace = true
web-time.workspace = true
rust-i18n = "4"
url.workspace = true
# 本地时区（文件修改时间、提交时间）：跨平台地按"那一刻"取偏移，夏令时两边都对
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 自定义应用图标的缩放 / 编码 / 套 Dock 版式（app_icon.rs，ADR 0018）；调试截图也用它编 PNG。
# 解码上传的图走 GPUI（它自带各格式解码与 SVG 光栅化），这里只要 PNG
image = { version = "0.25", default-features = false, features = ["png"] }

# ---------------- 只有原生才有的：语法高亮、钥匙串、数据目录、tokio ----------------
# 放在 target 表里而不是 feature：resolver 3 不会把非当前 target 依赖上的 feature 合并进来，
# wasm 构建因此天然没有 tree-sitter（gpui-component 在 wasm 上把它的依赖剔掉了，feature 却还会
# 打开引用它的代码，编不过）
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
tokio.workspace = true
directories = "6"
# 4.x 的默认 `v1` feature 保留 3.x 的 Entry 接口，底下换成 keyring-core + 各平台独立的 store crate；
# 存储口径与 3.x 的 apple-native / windows-native 一致（登录钥匙串的 generic password，
# service / account 两个属性；Windows 凭据名 `<user>.<service>`），升级前存的密码照样读得到
keyring = "4"

# ---------------- 浏览器 ----------------
[target.'cfg(target_family = "wasm")'.dependencies]
# chrono 的 Local 在 wasm 上不开 wasmbind 会静默当成 UTC
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Location", "Storage", "Window",
] }

# 运行时换 Dock 图标（app_icon.rs）。版本跟 GPUI / wry 已经带进来的那份一致，不多编一套
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
