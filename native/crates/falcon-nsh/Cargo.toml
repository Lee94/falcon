[package]
name = "falcon-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
snapshot = []

[dependencies]
falcon-proto.workspace = true
falcon-term.workspace = true
falcon-theme.workspace = true
falcon-core.workspace = true
falcon-platform.workspace = true

nsh-core.workspace = true
nsh-base.workspace = true
nsh-package.workspace = true

anyhow.workspace = true
bytes.workspace = true
base64.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
web-time.workspace = true
unicode-width = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
tiny-skia = "0.11.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
falcon-client.workspace = true

[dev-dependencies]
nsh-testing.workspace = true
nsh-engine.workspace = true
tempfile = "3"
