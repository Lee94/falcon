[package]
name = "falcon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
app-icon-image = ["dep:image", "dep:resvg", "dep:tiny-skia"]

[dependencies]
falcon-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
web-time.workspace = true
url.workspace = true
# TtlCache 的 in-flight 合并用 `Shared`；测试里的 block_on / oneshot 也来自它
futures.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"], optional = true }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"], optional = true }
tiny-skia = { version = "0.11.4", optional = true }

[dev-dependencies]
base64.workspace = true
