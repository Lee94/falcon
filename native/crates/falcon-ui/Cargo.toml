[package]
name = "falcon-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Falcon 客户端界面（GPUI）。原生（falcon-desktop）与浏览器（falcon-web）共用，平台能力只认 falcon-platform"

[features]
# 脚本化驱动（FALCON_AUTOMATE，见 src/automation.rs）。单开它不带 test-support，
# 压测（frames 步骤）量到的才是真实 release 的开销。由 falcon-desktop 的同名 feature 打开
automation = []
# 调试截图：打开 gpui-kit 的 test-support 才有 Window::render_to_image（Metal 回读，
# 锁屏时也能拿到画面）。见 src/snapshot.rs。test-support 会给元素多包一层观测，别拿它压测
snapshot = ["automation", "gpui-kit/test-support"]

[build-dependencies]
woff2 = { package = "woff2-patched", version = "0.4" }
bytes = "1"

[dependencies]
falcon-proto.workspace = true
falcon-client.workspace = true
falcon-term.workspace = true
falcon-theme.workspace = true
falcon-core.workspace = true
falcon-platform.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
futures.workspace = true
web-time.workspace = true
rust-i18n = "4"
url.workspace = true
# 本地时区（文件修改时间、提交时间）：跨平台地按"那一刻"取偏移，夏令时两边都对
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 自定义应用图标的缩放 / 编码 / 套 Dock 版式（app_icon.rs，ADR 0018）；调试截图也用它编 PNG。
# 解码上传的图走 GPUI（它自带各格式解码与 SVG 光栅化），这里只要 PNG
image = { version = "0.25", default-features = false, features = ["png"] }

# ---------------- 只有原生才有的：语法高亮 ----------------
# 放在 target 表里而不是 feature：resolver 3 不会把非当前 target 依赖上的 feature 合并进来，
# wasm 构建因此天然没有 tree-sitter（gpui-component 在 wasm 上把它的依赖剔掉了，feature 却还会
# 打开引用它的代码，编不过）
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }

# ---------------- 浏览器 ----------------
[target.'cfg(target_family = "wasm")'.dependencies]
# chrono 的 Local 在 wasm 上不开 wasmbind 会静默当成 UTC
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
