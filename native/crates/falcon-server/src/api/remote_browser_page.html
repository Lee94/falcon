<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>远端浏览器 · Falcon</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: light-dark(#f4f5f7,#16191f); color: light-dark(#222936,#e7ebf3); }
  main { width: min(480px, calc(100% - 64px)); padding: 32px; }
  .brand { font-size: 12px; letter-spacing: .14em; color: light-dark(#5b6577,#9ca9bd); }
  h1 { font-size: 26px; margin: 14px 0; }
  p { line-height: 1.7; overflow-wrap: anywhere; }
  label { display: block; margin-top: 24px; font-size: 14px; }
  input, button { box-sizing: border-box; font: inherit; border-radius: 8px; padding: 12px 14px; }
  input { width: 100%; margin: 8px 0 16px; border: 1px solid #7c8799; background: transparent; color: inherit; }
  button { border: 0; background: #355cce; color: white; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid #89a8ff; outline-offset: 3px; }
  #error { color: light-dark(#ad2939,#ff9fab); min-height: 1.7em; }
  .note { color: light-dark(#5b6577,#9ca9bd); font-size: 13px; margin-top: 28px; }
</style>
<main>
  <div class="brand">FALCON / REMOTE BROWSER</div>
  <h1>{{TITLE}}</h1>
  <p>{{MESSAGE}}</p>
  <form id="login" hidden>
    <label for="password">Falcon 访问密码</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录并继续</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
  <button id="retry" type="button">重试连接</button>
  <p class="note">浏览器在目标主机运行；关闭此窗口只断开观看，不清除远端登录资料。视频连接需要可达的 WebRTC 端口或 TURN 中继。</p>
</main>
<script>
  const login = document.getElementById('login');
  const retry = document.getElementById('retry');
  retry.onclick = () => location.reload();
  if ({{LOGIN}}) {
    login.hidden = false;
    retry.hidden = true;
    document.getElementById('password').focus();
  }
  login.onsubmit = async (event) => {
    event.preventDefault();
    const button = document.getElementById('submit');
    const error = document.getElementById('error');
    button.disabled = true;
    error.textContent = '';
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: document.getElementById('password').value})
      });
      document.getElementById('password').value = '';
      if (!response.ok) throw new Error(response.status === 401 ? '密码错误，请重试。' : '登录失败，请稍后重试。');
      location.reload();
    } catch (err) {
      error.textContent = err instanceof TypeError ? '无法连接 Falcon 服务端，请检查网络。' : err.message;
      button.disabled = false;
    }
  };
</script>
</html>
