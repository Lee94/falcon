<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Falcon · 远端浏览器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1115; color: #d6d9e0; font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: #171a21; border-bottom: 1px solid #262b36; flex: none; }
  #bar button { background: #232834; color: #d6d9e0; border: 1px solid #333b4a; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; line-height: 1; }
  #bar button:hover { background: #2c3342; }
  #url { flex: 1; background: #0f1115; color: #d6d9e0; border: 1px solid #333b4a; border-radius: 6px; padding: 5px 10px; font-size: 13px; outline: none; }
  #url:focus { border-color: #4a6fa5; }
  #stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; }
  #view { display: block; background: #fff; outline: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8b93a3; font-size: 14px; background: rgba(15,17,21,.85); z-index: 2; white-space: pre-wrap; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="bar">
  <button id="back" title="后退">&#x2039;</button>
  <button id="fwd" title="前进">&#x203a;</button>
  <button id="reload" title="刷新">&#x21bb;</button>
  <input id="url" spellcheck="false" placeholder="输入网址，回车访问">
</div>
<div id="stage"><canvas id="view" tabindex="0"></canvas><div id="status">连接中…</div></div>
<script>
"use strict";
// /remote-browser/<id>/ 下的相对路径就是 CDP 代理：/cdp/<path> -> 127.0.0.1:<port>/<path>
const base = location.pathname.replace(/\/+$/, "");
const cdpHttp = (p) => fetch(base + "/cdp" + p).then((r) => {
  if (!r.ok) throw new Error("CDP HTTP " + r.status);
  return r.json();
});

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const urlEl = document.getElementById("url");
const setStatus = (t) => { statusEl.style.display = t ? "flex" : "none"; statusEl.textContent = t; };

let ws, mid = 0;
const pending = new Map();
const send = (method, params) => new Promise((resolve, reject) => {
  const id = ++mid;
  pending.set(id, { resolve, reject });
  ws.send(JSON.stringify({ id, method, params: params || {} }));
});

function evalJs(expr) { return send("Runtime.evaluate", { expression: expr }); }

// 视口：画布尺寸就是 CDP 视口尺寸，坐标 1:1，不用缩放
function viewport() {
  const w = document.getElementById("stage").clientWidth;
  const h = document.getElementById("stage").clientHeight;
  return { w: Math.max(320, w), h: Math.max(240, h) };
}

async function applyViewport() {
  const { w, h } = viewport();
  canvas.width = w; canvas.height = h;
  await send("Emulation.setDeviceMetricsOverride", { width: w, height: h, deviceScaleFactor: 1, mobile: false });
}

async function pickPage() {
  let list = await cdpHttp("/json/list");
  let page = list.find((t) => t.type === "page");
  if (!page) page = await cdpHttp("/json/new?about:blank").catch(() => null);
  if (!page) throw new Error("没有可用的页面");
  return page;
}

const VK = { Backspace: 8, Tab: 9, Enter: 13, Shift: 16, Control: 17, Alt: 18, Escape: 27,
  " ": 32, PageUp: 33, PageDown: 34, End: 35, Home: 36, ArrowLeft: 37, ArrowUp: 38,
  ArrowRight: 39, ArrowDown: 40, Delete: 46, Meta: 91 };

function modifiers(e) {
  return (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
}

function keyEvent(e, down) {
  const common = { key: e.key, code: e.code, modifiers: modifiers(e),
    windowsVirtualKeyCode: VK[e.key] || e.keyCode || 0, nativeVirtualKeyCode: VK[e.key] || e.keyCode || 0 };
  if (down) {
    // 可打印字符走 char 让 Chrome 出文本；功能键走 rawKeyDown
    if (e.key.length === 1 && !(e.ctrlKey || e.metaKey)) {
      return [{ type: "rawKeyDown", ...common }, { type: "char", text: e.key, unmodifiedText: e.key, ...common }];
    }
    return [{ type: "rawKeyDown", ...common }];
  }
  return [{ type: "keyUp", ...common }];
}

function mouse(type, e, extra) {
  const r = canvas.getBoundingClientRect();
  return send("Input.dispatchMouseEvent", {
    type, x: e.clientX - r.left, y: e.clientY - r.top,
    button: e.button === 0 ? "left" : e.button === 1 ? "middle" : "right",
    buttons: (e.buttons & 1 ? 1 : 0) | (e.buttons & 4 ? 2 : 0) | (e.buttons & 2 ? 4 : 0),
    modifiers: modifiers(e), clickCount: type === "mouseMoved" ? 0 : 1, ...extra,
  });
}

async function connect() {
  setStatus("连接中…");
  let page;
  try { page = await pickPage(); } catch (e) { setStatus("远端浏览器还没就绪：" + e.message + "\n稍后自动重试"); return setTimeout(connect, 3000); }
  const wsUrl = new URL(page.webSocketDebuggerUrl);
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/cdp" + wsUrl.pathname);
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.id !== undefined) {
      const p = pending.get(m.id); pending.delete(m.id);
      if (p) m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
      return;
    }
    if (m.method === "Page.screencastFrame") {
      const f = m.params;
      send("Page.screencastFrameAck", { sessionId: f.sessionId }).catch(() => {});
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
      img.src = "data:image/" + (f.metadata && f.metadata.deviceScaleFactor ? "jpeg" : "jpeg") + ";base64," + f.data;
      setStatus("");
    }
    if (m.method === "Page.screencastVisibilityChanged") {
      if (!m.params.visible) send("Page.startScreencast", screencastArgs()).catch(() => {});
    }
    if (m.method === "Page.frameNavigated" && m.params.frame && !m.params.frame.parentId) {
      urlEl.value = m.params.frame.url;
    }
  };
  ws.onopen = async () => {
    try {
      await send("Page.enable");
      await applyViewport();
      await send("Page.setWebLifecycleState", { state: "active" }).catch(() => {});
      await send("Page.startScreencast", screencastArgs());
      setStatus("");
      const nav = await send("Page.getNavigationHistory").catch(() => null);
      if (nav && nav.entries[nav.currentIndex]) urlEl.value = nav.entries[nav.currentIndex].url;
    } catch (e) { setStatus("初始化失败：" + e.message); }
  };
}
const screencastArgs = () => ({ format: "jpeg", quality: 70, maxWidth: 1920, maxHeight: 1200, everyNthFrame: 1 });

urlEl.addEventListener("focus", () => urlEl.select());
urlEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  let u = urlEl.value.trim();
  if (!u) return;
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) u = u.includes(".") && !u.includes(" ") ? "https://" + u : "https://www.google.com/search?q=" + encodeURIComponent(u);
  send("Page.navigate", { url: u }).then(() => { urlEl.value = u; }).catch(() => {});
  urlEl.blur(); canvas.focus();
});
document.getElementById("back").onclick = () => evalJs("history.back()");
document.getElementById("fwd").onclick = () => evalJs("history.forward()");
document.getElementById("reload").onclick = () => send("Page.reload", { ignoreCache: false });

canvas.addEventListener("mousedown", (e) => { mouse("mousePressed", e); e.preventDefault(); canvas.focus(); });
canvas.addEventListener("click", () => canvas.focus());
canvas.addEventListener("mouseup", (e) => mouse("mouseReleased", e));
canvas.addEventListener("mousemove", (e) => { if (e.buttons) mouse("mouseMoved", e); });
canvas.addEventListener("wheel", (e) => { e.preventDefault(); mouse("mouseWheel", e, { deltaX: e.deltaX, deltaY: e.deltaY }); }, { passive: false });
canvas.addEventListener("contextmenu", (e) => { e.preventDefault(); mouse("mousePressed", { ...e, button: 2, clientX: e.clientX, clientY: e.clientY, buttons: 2 }); });
window.addEventListener("keydown", (e) => {
  if (document.activeElement === urlEl) return;
  e.preventDefault();
  keyEvent(e, true).forEach((p) => send("Input.dispatchKeyEvent", p));
});
window.addEventListener("keyup", (e) => {
  if (document.activeElement === urlEl) return;
  e.preventDefault();
  keyEvent(e, false).forEach((p) => send("Input.dispatchKeyEvent", p));
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => applyViewport().catch(() => {}), 200); });
connect();
</script>
</body>
</html>
