[package]
name = "falcon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "falcon 服务端的 Rust 实现（docs/design/rust-unification.md S 线），替换 packages/server"

[lib]
path = "src/lib.rs"

# S7 切换时改名为 falcon（与现在 SEA 产物同名，service install 认它）
[[bin]]
name = "falcon-server"
path = "src/main.rs"

[dependencies]
falcon-proto.workspace = true
falcon-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log = { workspace = true, features = ["std"] }
base64.workspace = true
regex = "1"
tokio = { workspace = true, features = ["process", "signal"] }
futures.workspace = true
bytes.workspace = true
url.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.11.1"
scrypt = "0.12.0"
rand = "0.10.3"
hex = "0.4.3"
subtle = "2.6.1"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
sha2 = "0.11.0"
indexmap = "2"
getrandom = "0.4"
http = "1"
portable-pty = "0.9.0"
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"], optional = true }
# 下载第三方二进制（px0，ADR 0017 决定四）。TLS 与 falcon-client 同一套：rustls + ring +
# 系统信任库（rustls-platform-verifier），不带 aws-lc-sys / webpki-roots；只讲 HTTP/1.1
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[features]
# 把前端产物编进二进制（S7 发布构建用）。构建时用 FALCON_EMBED_WEB_DIR 指向产物目录（绝对路径），
# 运行时 FALCON_WEB_DIST 仍可覆盖
embed-web = ["dep:rust-embed"]
