[package]
name = "falcon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "falcon 服务端的 Rust 实现（docs/design/rust-unification.md S 线），替换 packages/server"

[lib]
path = "src/lib.rs"

# S7 切换时改名为 falcon（与现在 SEA 产物同名，service install 认它）
[[bin]]
name = "falcon-server"
path = "src/main.rs"

[dependencies]
falcon-proto.workspace = true
falcon-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log = { workspace = true, features = ["std"] }
base64.workspace = true
regex = "1"
tokio = { workspace = true, features = ["process", "signal"] }
futures.workspace = true
bytes.workspace = true
url.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.11.1"
scrypt = "0.12.0"
rand = "0.10.3"
hex = "0.4.3"
subtle = "2.6.1"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
sha2 = "0.11.0"
indexmap = "2"
getrandom = "0.4"
http = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
