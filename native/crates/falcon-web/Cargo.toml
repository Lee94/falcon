[package]
name = "falcon-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Falcon 浏览器版（docs/design/rust-unification.md）：wasm 入口与平台能力的浏览器实现，界面在 falcon-ui"

# 只为 wasm32-unknown-unknown 而存在：`native/scripts/build-web.sh` 编它、跑 wasm-bindgen、
# 拼出 index.html。原生上 `cargo check --workspace` 也会编到它，那时是个空 lib
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
falcon-ui.workspace = true
falcon-platform.workspace = true
falcon-core.workspace = true
gpui-kit.workspace = true
log.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration", "Document", "Element", "EventTarget", "HtmlAnchorElement", "HtmlElement", "Location", "Navigator",
    "Storage", "Window",
] }
