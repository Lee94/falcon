[package]
name = "falcon-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
falcon-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
futures.workspace = true
bytes.workspace = true
url.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
percent-encoding = "2"

# TLS 一律 rustls（设计文档 §4.7 / §4.8）：不要 native-tls / openssl。
# 加密后端用 ring——workspace 里别的 crate 已经带着它，不再引入 aws-lc-sys 那一套 C 构建。
# 证书校验走 rustls-platform-verifier，认系统信任库：用户在钥匙串里信任的自签证书也能用。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# reqwest 0.13 的默认 TLS 是 rustls + aws-lc-rs：关掉默认，只开不挑加密后端的
# `rustls-no-provider`——ClientConfig（ring 后端、根证书与校验器）由我们用
# use_preconfigured_tls 交进去（见 tls.rs），它自己不带 aws-lc-sys / webpki-roots。
# 不开 http2：falcon 服务端只讲 HTTP/1.1，反代后面也一样；少一个 h2 依赖。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }

# WS 只要握手，TLS 自己接（tokio-rustls）：tokio-tungstenite 的 rustls 支持挂在
# 双下划线的私有 feature 上，而且会顺带拉 webpki-roots / native-certs。
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
