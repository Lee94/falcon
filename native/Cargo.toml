# Falcon 原生客户端（GPUI）。设计见 docs/design/gpui-client.md。
#
# 仓库里唯一的构建系统（服务端、客户端与构建任务 xtask 都在这里）。GPUI 只出现在 falcon-app，
# 其余 crate 不依赖 GPUI——GPUI 每次破坏性升级只波及一层。
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# 滚动位置插件（ADR 0019）是独立的 wasm32-wasip1 crate，有自己的 Cargo.lock，不进工作区
exclude = ["zellij-plugin"]
default-members = ["crates/falcon-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
falcon-proto = { path = "crates/falcon-proto" }
falcon-client = { path = "crates/falcon-client" }
falcon-term = { path = "crates/falcon-term" }
falcon-theme = { path = "crates/falcon-theme" }
falcon-core = { path = "crates/falcon-core" }

# GPUI 走 gpui-kit 总包：它把 gpui-pre / gpui-pre-platform / gpui-base /
# gpui-component / 默认资源锁在同一版本上。升级 GPUI 就是升级这一行（连同
# gpui-wry），并按新快照对应的 zed commit 重新比对从 Zed 抄来的文件。
gpui-kit = { version = "=0.7.1" }
# zed@279fe07（gpui-pre 0.3.8 的快照点）锁的 alacritty fork。抄来的 Zed 终端
# 代码依赖这个 fork 的 API，别换成 crates.io 上的 alacritty_terminal。
# 实际编的是 vendor/alacritty_terminal（见文件末尾的 [patch]）：加了 `tty` 开关，falcon-term
# 关掉它才编得到 wasm。Falcon 只用 Term / grid / vte，PTY 在服务端。
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f", default-features = false, features = ["serde"] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
bytes = "1"
url = "2"
base64 = "0.23"
# Instant / SystemTime：原生上就是 std 的重导出，wasm 上走 performance.now / Date.now
# （std 的这两个在 wasm32-unknown-unknown 上一调就 panic）。下层 crate 一律用它
web-time = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }

[profile.dev]
# GPUI 在纯 debug 下帧时间很难看，依赖开一点优化，自己的代码保持可调试。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# 浏览器版（falcon-web）：体积优先。wasm 要整个下载完才能启动，每 MB 都是首屏时间；
# 调试行表在浏览器里也用不上
[profile.web]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = true
codegen-units = 1

# 构建脚本是宿主机上的可执行文件，绕开 rustup 代理时 strip 用的 rust-objcopy 找不到 libLLVM
# 而报警告；它们也不进产物，不必 strip
[profile.web.build-override]
strip = false

# 去掉 tty 模块的 alacritty fork（vendor/alacritty_terminal/Cargo.toml 顶部注释写了改了什么、怎么升级）
[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# gpui-web 平台层的 fork（vendor/gpui-pre-web/Cargo.toml 顶部有改动清单）
[patch.crates-io]
gpui-pre-web = { path = "vendor/gpui-pre-web" }
