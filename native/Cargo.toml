# Falcon 的 Cargo workspace：服务端（falcon-server）、客户端（原生 falcon-desktop + 浏览器 falcon-web，
# 界面在 falcon-ui）与构建任务（xtask）。客户端设计见 docs/design/gpui-client.md 与 rust-unification.md。
#
# 仓库里唯一的构建系统（服务端、客户端与构建任务 xtask 都在这里）。GPUI 只出现在客户端的
# falcon-platform / falcon-ui / falcon-desktop / falcon-web 四个 crate，其余 crate 不依赖 GPUI——
# GPUI 每次破坏性升级只波及这一层。
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# 会话守护进程（ADR 0020）是独立的工作区：它链 libghostty-vt 的静态库（要 Zig 编），
# 放进来的话 `cargo test --workspace` 就离不开 Zig 了
exclude = ["sessiond"]
default-members = ["crates/falcon-desktop"]

[workspace.package]
version = "0.3.8"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
falcon-proto = { path = "crates/falcon-proto" }
falcon-client = { path = "crates/falcon-client" }
falcon-term = { path = "crates/falcon-term" }
falcon-theme = { path = "crates/falcon-theme" }
falcon-core = { path = "crates/falcon-core" }
falcon-platform = { path = "crates/falcon-platform" }
falcon-ui = { path = "crates/falcon-ui" }

# GPUI 走 gpui-kit 总包：它把 gpui-pre / gpui-pre-platform / gpui-base /
# gpui-component / 默认资源锁在同一版本上。升级 GPUI 就是升级这一行（连同
# gpui-wry），并按新快照对应的 zed commit 重新比对从 Zed 抄来的文件。
#
# `gpui-fast`：核心、平台层与各层组件换成 Longbridge 的 GPUI Fast（Zed GPUI 的 fork，
# 渲染与布局的性能优化），`gpui_kit::*` 的路径不变。上游 gpui-pre 一族照样是 gpui-kit 的
# 非可选依赖、照样参与编译，只是不再导出。浏览器版因此跑在 gpui-fast-web 上，IME 补丁
# 在 vendor/gpui-fast-web；gpui-fast 本身也带了一处补丁（见文件末尾的 [patch]）。
gpui-kit = { version = "=0.7.3", features = ["gpui-fast"] }
# zed@93d7456（gpui-pre 0.3.9 的快照点；与上一版 279fe07 锁的是同一个 rev）锁的 alacritty fork。抄来的 Zed 终端
# 代码依赖这个 fork 的 API，别换成 crates.io 上的 alacritty_terminal。
# 实际编的是 vendor/alacritty_terminal（见文件末尾的 [patch]）：加了 `tty` 开关，falcon-term
# 关掉它才编得到 wasm。Falcon 只用 Term / grid / vte，PTY 在服务端。
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f", default-features = false, features = ["serde"] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
bytes = "1"
url = "2"
base64 = "0.23"
# Instant / SystemTime：原生上就是 std 的重导出，wasm 上走 performance.now / Date.now
# （std 的这两个在 wasm32-unknown-unknown 上一调就 panic）。下层 crate 一律用它
web-time = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }

[profile.dev]
# GPUI 在纯 debug 下帧时间很难看，依赖开一点优化，自己的代码保持可调试。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# 浏览器版（falcon-web）：体积优先。wasm 要整个下载完才能启动，每 MB 都是首屏时间；
# 调试行表在浏览器里也用不上
[profile.web]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = true
codegen-units = 1

# 构建脚本是宿主机上的可执行文件，绕开 rustup 代理时 strip 用的 rust-objcopy 找不到 libLLVM
# 而报警告；它们也不进产物，不必 strip
[profile.web.build-override]
strip = false

# 去掉 tty 模块的 alacritty fork（vendor/alacritty_terminal/Cargo.toml 顶部注释写了改了什么、怎么升级）
[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# GPUI 的 fork（各自 Cargo.toml 顶部有改动清单）：
# - gpui-fast：文字排版跨帧沿用时比字体代数，浏览器版后到的中文字体才会生效；
# - web / platform 两层：浏览器版跑的是 gpui-fast-web，IME 候选框跟随光标的补丁在它身上；四份都
#   关掉了默认的 `multithreaded`——它拉进只能 nightly 编的 wasm_thread，而 gpui-kit 按默认
#   feature 依赖这两层，上游 gpui-pre 那一族开了 gpui-fast 也照样参与编译，所以两族都得关
[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-web = { path = "vendor/gpui-fast-web" }
gpui-fast-platform = { path = "vendor/gpui-fast-platform" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-platform = { path = "vendor/gpui-pre-platform" }
