# Falcon 的 Cargo workspace：服务端（falcon-server）、NSH 跨端统一客户端（falcon-app，
# 界面在 falcon-nsh，覆盖 macOS / Windows / Linux GTK4 / Android / Web WASM / TUI）与构建任务（xtask）。
#
# 仓库里唯一的构建系统（服务端、客户端与构建任务 xtask 都在这里）。NSH 只出现在客户端的
# falcon-nsh / falcon-app 两个 crate，其余 crate 不依赖 NSH——框架升级只波及这一层。
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# 会话守护进程（ADR 0020）是独立的工作区：它链 libghostty-vt 的静态库（要 Zig 编），
# 放进来的话 `cargo test --workspace` 就离不开 Zig 了
exclude = ["sessiond"]
default-members = ["crates/falcon-app"]

[workspace.package]
version = "0.3.28"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
falcon-proto = { path = "crates/falcon-proto" }
falcon-client = { path = "crates/falcon-client" }
falcon-term = { path = "crates/falcon-term" }
falcon-theme = { path = "crates/falcon-theme" }
falcon-core = { path = "crates/falcon-core" }
falcon-platform = { path = "crates/falcon-platform" }
falcon-nsh = { path = "crates/falcon-nsh" }

# Native Shell (NSH) 跨端统一界面层（ADR 0028）：纯 Rust 主应用与声明式/签名插件双轨，主路径零 QuickJS 开销。
nsh-core = "0.5.1"
nsh-base = { version = "0.5.1", default-features = false, features = ["editor", "highlight", "plot"] }
nsh-engine = { version = "0.5.1", default-features = false }
nsh-package = "0.5.1"
nsh-testing = { version = "0.5.1", default-features = false }
nsh-platform-tui = { version = "0.5.1", default-features = false, features = ["run-app"] }

# zed@93d7456 锁定的 alacritty fork。抄来的 Zed 终端按键/模式代码依赖这个 fork 的 API，
# 别换成 crates.io 上的 alacritty_terminal。
# 实际编的是 vendor/alacritty_terminal（见文件末尾的 [patch]）：加了 `tty` 开关，falcon-term
# 关掉它才编得到 wasm。Falcon 只用 Term / grid / vte，PTY 在服务端。
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f", default-features = false, features = ["serde"] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.13"
futures = "0.3"
bytes = "1"
url = "2"
base64 = "0.23"
# Instant / SystemTime：原生上就是 std 的重导出，wasm 上走 performance.now / Date.now
# （std 的这两个在 wasm32-unknown-unknown 上一调就 panic）。下层 crate 一律用它
web-time = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }

[profile.dev]
# 渲染与终端网格依赖在纯 debug 下帧时间偏慢，依赖开一点优化，自己的代码保持可调试。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# 去掉 tty 模块的 alacritty fork（vendor/alacritty_terminal/Cargo.toml 顶部注释写了改了什么、怎么升级）
[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
