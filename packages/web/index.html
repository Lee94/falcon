<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：移动壳把安全区染成顶栏底色，不留白边；
      interactive-widget=resizes-content：Android 软键盘压缩 layout viewport，
      键位条随之上移（iOS 不认这个字段，由 MobileShell 里的 visualViewport 兜）；
      maximum-scale=1：阻止 iOS 聚焦 xterm 隐藏输入框时的自动放大——Safari
      只拿它挡自动缩放，双指捏合仍然有效。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Falcon</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Falcon" />
    <!--
      主题在解析到 <body> 之前就定下来：晚一帧就会白闪一下，深色用户在夜里
      被闪到是很难受的。这时 body 还是空的，看得见的只有 html 的底色，所以
      这里只写 --background / --foreground 与 .dark，整套 token 等 React 起来后
      由 src/lib/theme/apply.ts 落。偏好的 key 与结构必须与 src/lib/theme/pref.ts
      一致：falcon.themes = { mode, light: { colors }, dark: { colors } }；
      深浅按选中主题的底色亮度判（与 @falcon/shared 的 appearanceFromHex 同一公式）。
      样式表是异步加载的，所以这里也顺带把 html 的底色兜住。
    -->
    <style>
      html {
        background: var(--background, #ffffff);
        color-scheme: light;
      }
      html.dark {
        background: var(--background, #0a0a0a);
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var bg = "#ffffff";
        var fg = "#171717";
        var dark = false;
        try {
          var raw = localStorage.getItem("falcon.themes");
          var pref = raw ? JSON.parse(raw) : null;
          var mode = pref && pref.mode;
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            // 旧版只存明暗模式；第一次升级后 React 会把新格式写回去
            mode = localStorage.getItem("falcon.theme") || localStorage.getItem("mojito.theme");
          }
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var slot = mode === "light" || mode === "dark" ? mode : system ? "dark" : "light";
          var colors = pref && pref[slot] && pref[slot].colors;
          var hex = /^#[0-9a-f]{6}$/i;
          if (colors && hex.test(colors.background) && hex.test(colors.foreground)) {
            bg = colors.background;
            fg = colors.foreground;
            dark = luminance(bg) <= 0.5;
          } else {
            dark = slot === "dark";
            bg = dark ? "#0a0a0a" : "#ffffff";
            fg = dark ? "#fafafa" : "#171717";
          }
        } catch (e) {
          // 读不到偏好就用浅色，等 React 起来后再由 store 纠正
        }
        root.style.setProperty("--background", bg);
        root.style.setProperty("--foreground", fg);
        if (dark) root.classList.add("dark");
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", bg);

        function luminance(hex) {
          var lin = function (i) {
            var s = parseInt(hex.slice(i, i + 2), 16) / 255;
            return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
          };
          return 0.2126 * lin(1) + 0.7152 * lin(3) + 0.0722 * lin(5);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
