<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：移动壳把安全区染成顶栏底色，不留白边；
      interactive-widget=resizes-content：Android 软键盘压缩 layout viewport，
      键位条随之上移（iOS 不认这个字段，由 MobileShell 里的 visualViewport 兜）；
      maximum-scale=1：阻止 iOS 聚焦 xterm 隐藏输入框时的自动放大——Safari
      只拿它挡自动缩放，双指捏合仍然有效。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Mojito</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mojito" />
    <!--
      主题在解析到 <body> 之前就定下来：晚一帧就会白闪一下，深色用户在夜里
      被闪到是很难受的。key 与取值必须与 src/lib/theme.ts 保持一致。
      样式表是异步加载的，所以这里也顺带把 html 的底色兜住。
    -->
    <style>
      html {
        background: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background: #0a0a0a;
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("mojito.theme");
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
        } catch (e) {
          // 读不到偏好就用浅色，等 React 起来后再由 store 纠正
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
